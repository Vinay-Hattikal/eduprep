name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  AUTH_MODE: dev
  # Test-only secret; real secrets never live in the repo.
  AUTH_SECRET: ci-test-secret-not-used-anywhere-else-0123456789
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduprep
  NEXT_PUBLIC_APP_NAME: EduPrep
  NEXT_PUBLIC_APP_URL: http://localhost:3200

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: node scripts/check-brand.mjs
      - run: npm run build

  e2e:
    name: Integration + end-to-end (desktop + 360 px phone)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduprep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The local judge (D-033) compiles and runs code with real toolchains. Ubuntu runners
      # ship gcc/g++; pin Java and Python so verdicts don't drift.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Integration tests use a separate eduprep_test database on the same server.
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
